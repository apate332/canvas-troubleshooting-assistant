<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Canvas Troubleshooter</title>

    <style>
        body {
            width: 380px;
            margin: 0;
            padding: 20px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f8fafc;
            color: #172033;
        }

        h1 {
            margin: 0;
            font-size: 19px;
        }

        .subtitle {
            margin: 6px 0 18px;
            color: #64748b;
            font-size: 13px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 14px;
        }

        .section-title {
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #475569;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #64748b;
            font-size: 12px;
        }

        .value {
            text-align: right;
            font-size: 12px;
            font-weight: 600;
            max-width: 220px;
            word-break: break-word;
        }

        #status {
            margin-bottom: 14px;
            font-size: 13px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #1e293b;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            min-height: 85px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
        }

        #configurationSection,
        #problemSection {
            display: none;
        }

        .success {
            color: #166534;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <h1>Canvas Troubleshooter</h1>

    <div class="subtitle">
        Troubleshoot the Canvas activity you're viewing.
    </div>

    <div id="status">
        Checking current page...
    </div>

    <div class="card">
        <div class="section-title">
            Detected Activity
        </div>

        <div class="row">
            <span class="label">Type</span>
            <span id="pageType" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Course ID</span>
            <span id="courseId" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Activity ID</span>
            <span id="activityId" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Name</span>
            <span id="activityName" class="value">—</span>
        </div>
    </div>


    <button id="troubleshootButton" disabled>
        Collect Canvas Configuration
    </button>


    <div
        id="configurationSection"
        class="card"
        style="margin-top: 14px;"
    >
        <div class="section-title">
            Canvas Configuration
        </div>

        <div class="row">
            <span class="label">Published</span>
            <span id="published" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Submission</span>
            <span id="submissionType" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Due date</span>
            <span id="dueDate" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Unlock date</span>
            <span id="unlockDate" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">Lock date</span>
            <span id="lockDate" class="value">—</span>
        </div>

        <div class="row">
            <span class="label">External tool</span>
            <span id="externalTool" class="value">—</span>
        </div>
    </div>


    <div
        id="problemSection"
        style="margin-top: 14px;"
    >
        <div class="card">
            <div class="section-title">
                What's going wrong?
            </div>

            <textarea
                id="problemInput"
                placeholder="Example: Students can see this assignment, but the lab will not open."
            ></textarea>
        </div>

        <button id="analyzeButton">
            Analyze Problem
        </button>

        <div
    id="resultsSection"
    class="card"
    style="display: none; margin-top: 14px;"
>
    <div class="section-title">
        Troubleshooting Result
    </div>

    <div id="resultsContent"></div>
</div>
    </div>

    <script src="popup.js"></script>

</body>
</html>
